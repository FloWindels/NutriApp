; Mavi'oh — réglages PHP de production.
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 14M
; Les appels IA relèvent eux-mêmes la limite le temps de l'appel (LlmExecutionTime).
max_execution_time = 30
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
