; Mavi'oh — pool PHP-FPM.
; Une génération IA occupe un processus pendant toute son attente dans la file (jusqu'à
; ~25 s) puis toute sa durée (jusqu'à ~60 s). Avec 2 générations et 6 attentes au plus,
; il reste toujours une vingtaine de processus pour le reste de l'application.
[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000
request_terminate_timeout = 150s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
