# Mavi'oh — Nginx devant l'API Laravel (conteneur api-nginx). Deux portes :
#
#   :80    publique — publiée sur 127.0.0.1, cloudflared y mène mavioh-api.<domaine> pour
#          l'application mobile. Ne sert que /api/, et jamais l'administration : /api/admin
#          répond 404, exactement comme une adresse qui n'existe pas.
#   :8080  interne — jamais publiée, joignable seulement par le conteneur du site (réseau
#          « front »). C'est par elle que passent les pages /admin du site.
#
# Les deux transmettent l'IP du visiteur à Laravel : CF-Connecting-IP est posé par Cloudflare
# en bordure (toute valeur envoyée par le client y est écrasée), puis relayé par le site.
# Seuls des émetteurs internes atteignent ces ports, d'où la confiance accordée aux réseaux privés.

set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server_tokens off;

# DNS interne de Docker, relu toutes les 10 s : quand le conteneur PHP redémarre et change
# d'adresse, Nginx le retrouve au lieu de répondre 502 jusqu'à son propre redémarrage.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTPS vu de Laravel quand Cloudflare l'a terminé.
map $http_x_forwarded_proto $mavioh_https {
    default "";
    https on;
}

# --- Porte publique ------------------------------------------------------------
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/mavioh-common.conf;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /api/admin { return 404; }
    location ^~ /api/v1/admin { return 404; }

    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Rien d'autre n'est servi : ni page d'accueil Laravel, ni fichier de public/.
    location / { return 404; }

    include /etc/nginx/snippets/mavioh-php.conf;
}

# --- Porte interne (site Next.js uniquement) ------------------------------------
server {
    listen 8080;
    server_name _;
    include /etc/nginx/snippets/mavioh-common.conf;

    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    location / { return 404; }

    include /etc/nginx/snippets/mavioh-php.conf;
}
