# Seul le contrôleur frontal de Laravel est exécuté ; tout autre .php répond 404.
location = /index.php {
    internal;
    set $mavioh_php api:9000;       # variable : résolu à chaque requête (voir resolver)
    fastcgi_pass $mavioh_php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param HTTPS $mavioh_https;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 150s;
}

location ~ \.php$ { return 404; }
